[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mb-segment"
version = "0.1.0"
description = "Cerebral microbleed detection on T2*-GRE and SWI with pre-trained anisotropic 3D U-Nets (CPU is enough)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "mendeltem"}]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "nibabel>=5.0",
    "torch>=2.1",
]

[project.optional-dependencies]
n4 = ["SimpleITK>=2.3"]          # N4 bias-field correction when FSL is not installed
test = ["pytest>=7"]

[project.scripts]
mb_segment = "mb_segment.cli:main"

[tool.setuptools]
packages = ["mb_segment"]

[tool.setuptools.package-data]
mb_segment = ["weights.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
